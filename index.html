<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Floorplan</title>
  <link rel="icon" href="./favicon.ico" />
  <style>
    :root{
      --bg:#ffffff; --fg:#111; --muted:#666; --border:#e6e6e6;
      --sold:#e74c3c; --avail:#e0a070;
      --card:#fff;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
    .title{font-weight:900;font-size:22px;}
    .tools{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;}
    button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;}
    main{display:grid;grid-template-columns: 1fr 420px;gap:14px;padding:14px;align-items:start;}
    @media (max-width: 980px){ main{grid-template-columns:1fr;} }
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .cardHead{padding:12px 14px;font-weight:900;border-bottom:1px solid var(--border);}
    .planBody{padding:12px;}
    .planWrap{width:100%;aspect-ratio: 16/9; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fafafa; position:relative;}
    .svgHost{width:100%;height:100%;}
    .calloutSvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
    .labelBay{position:absolute;left:0;bottom:0;width:100%;height:84px;pointer-events:none;}
    .lozenge{position:absolute;left:18px;bottom:18px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:2px;max-width:70%;}
    .lozStand{font-weight:950;font-size:26px;line-height:1;}
    .lozCompany{font-weight:800;color:var(--muted);}
    .side .section{padding:12px 14px;border-bottom:1px solid var(--border);}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:10px 10px;border-bottom:1px solid var(--border);text-align:left;font-weight:700;}
    th{color:var(--muted);font-size:12px;letter-spacing:.02em;text-transform:uppercase;}
    tr.active{background:#fff7ed;}
    .listWrap{max-height: 52vh; overflow:auto;}
    .hint{color:var(--muted);font-weight:800;font-size:13px;padding-top:8px;}
    input{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:700;width:100%;}
    .dot{display:inline-block;width:10px;height:10px;border-radius:99px;margin-right:8px;vertical-align:middle;}
  </style>
</head>
<body>
<header>
  <div class="title" id="eventName">Floorplan</div>
  <div class="tools">
    <div style="color:var(--muted);font-weight:800;">Updated: <span id="updatedAt">—</span></div>
    <button id="clearBtn">Clear selection</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="cardHead">Plan</div>
    <div class="planBody">
      <div class="planWrap" id="planWrap">
        <div id="svgHost" class="svgHost"></div>
        <svg class="calloutSvg" id="calloutSvg" aria-hidden="true"></svg>
        <div class="labelBay" id="labelBay">
          <div class="lozenge" id="lozenge" style="display:none;">
            <div class="lozStand" id="lozStand">—</div>
            <div class="lozCompany" id="lozCompany" style="display:none;"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="card side">
    <div class="section">
      <div style="font-weight:900;margin-bottom:10px;">Selected exhibitor</div>
      <div style="font-size:44px;font-weight:950;line-height:1;" id="selStand">None</div>
      <div style="margin-top:8px;color:var(--muted);font-weight:800;" id="selCompany">
        Desktop: click a stand or choose from the list. Phone: use the list (plan tapping is disabled).
      </div>
    </div>

    <div class="section">
      <div style="font-weight:900;margin-bottom:10px;">Exhibitors</div>
      <div style="display:flex;gap:10px;">
        <input id="search" placeholder="Search company or stand..."/>
        <button id="clearSearchBtn" type="button">Clear</button>
      </div>
      <div class="hint"><span id="count">0</span> / <span id="total">0</span></div>
      <div class="listWrap">
        <table>
          <thead><tr><th style="width:90px;">Stand</th><th>Company</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </aside>
</main>

<script src="./shared.js?v=20260209" defer></script>
<script src="./index.js?v=20260209" defer></script>
</body>
</html>
