<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Floorplan Admin</title>
  <link rel="icon" href="./favicon.ico" />
  <style>
    :root{
      --bg:#ffffff; --fg:#111; --muted:#666; --border:#e6e6e6;
      --sold:#e74c3c; --avail:#e0a070;
      --card:#fff;
    }
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--fg);}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 18px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
    .title{font-weight:900;font-size:22px;}
    .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;}
    button{border:1px solid var(--border);background:#fff;border-radius:10px;padding:10px 12px;font-weight:800;cursor:pointer;}
    button.primary{background:#16a34a;color:#fff;border-color:#16a34a;}
    button.danger{background:#fff0f0;border-color:#ffb3b3;color:#b00020;}
    button:disabled{opacity:.5;cursor:not-allowed;}
    input,select{border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-weight:700;}
    main{display:grid;grid-template-columns: 1fr 420px;gap:14px;padding:14px;align-items:start;}
    @media (max-width: 980px){ main{grid-template-columns:1fr;} }
    .card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;}
    .cardHead{padding:12px 14px;font-weight:900;border-bottom:1px solid var(--border);}
    .planBody{padding:12px;}
    .planStack{position:relative;}
    .planWrap{width:100%;aspect-ratio: 16/9; border:1px solid var(--border); border-radius:12px; overflow:hidden; background:#fafafa;}
    .svgHost{width:100%;height:100%;}
    .calloutSvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
    .labelBay{position:absolute;left:0;bottom:0;width:100%;height:84px;pointer-events:none;}
    .lozenge{position:absolute;left:18px;bottom:18px;background:#fff;border:1px solid var(--border);border-radius:999px;padding:10px 14px;box-shadow:0 6px 20px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:2px;max-width:70%;}
    .lozStand{font-weight:950;font-size:26px;line-height:1;}
    .lozCompany{font-weight:800;color:var(--muted);}
    .legend{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--border);}
    .pill{display:flex;gap:8px;align-items:center;border:1px solid var(--border);border-radius:999px;padding:6px 10px;font-weight:800;}
    .sw{width:10px;height:10px;border-radius:99px;}
    .side .section{padding:12px 14px;border-bottom:1px solid var(--border);}
    .row{display:grid;grid-template-columns: 1fr 1fr;gap:10px;}
    .bigBtnRow{display:flex;gap:10px;margin-top:10px;}
    .bigBtnRow button{flex:1;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:10px 10px;border-bottom:1px solid var(--border);text-align:left;font-weight:700;}
    th{color:var(--muted);font-size:12px;letter-spacing:.02em;text-transform:uppercase;}
    tr.active{background:#fff7ed;}
    .listWrap{max-height: 48vh; overflow:auto;}
    .hint{color:var(--muted);font-weight:800;font-size:13px;padding-top:8px;}
    /* Zoom */
    .zoomCard{margin:12px;}
    .zoomBody{padding:12px;}
    .zoomWrap{position:relative;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:#fff;aspect-ratio: 16/9;}
    .zoomSvgHost{position:absolute;inset:0;}
    .zoomSvgHost svg{width:100%;height:100%;display:block;}
    .zoomRing{position:absolute;left:50%;top:50%;width:160px;height:160px;border:6px solid rgba(120,120,120,.6);border-radius:999px;transform:translate(-50%,-50%);box-shadow:0 10px 30px rgba(0,0,0,.12);pointer-events:none;}
    /* Progress overlay */
    .progressOverlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:50;}
    .progressCard{background:#fff;border-radius:16px;border:1px solid var(--border);padding:18px;min-width: min(420px, 92vw);box-shadow:0 20px 60px rgba(0,0,0,.25);}
    .progressTitle{font-weight:950;font-size:18px;}
    .progressMsg{margin-top:6px;color:var(--muted);font-weight:800;}
    .progressBar{margin-top:12px;height:10px;background:#f2f2f2;border-radius:99px;overflow:hidden;}
    #progressBarFill{height:100%;width:0;background:#16a34a;}
  </style>
</head>
<body>
<header>
  <div class="title">Floorplan Admin</div>
  <div class="tools">
    <div style="color:var(--muted);font-weight:800;">Synced: <span id="syncedAt">—</span></div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div style="font-weight:900;">Event name</div>
      <input id="eventName" placeholder="New Event"/>
      <button id="setEventBtn" class="primary">Set</button>
    </div>
    <button id="pauseBtn">Pause sync</button>
    <button id="exportBtn">Export CSV</button>
    <button id="importBtn">Import CSV</button>
    <button id="resetBtn" class="danger">Reset all</button>
  </div>
</header>

<main>
  <section class="card">
    <div class="cardHead">Plan</div>
    <div class="planBody">
      <div class="planStack noSel" id="planStack">
        <div class="planWrap" id="planWrap">
          <div id="svgHost" class="svgHost"></div>
          <svg class="calloutSvg" id="calloutSvg" aria-hidden="true"></svg>
          <div class="labelBay" id="labelBay">
            <div class="lozenge" id="lozenge" style="display:none;">
              <div class="lozStand" id="lozStand">—</div>
              <div class="lozCompany" id="lozCompany" style="display:none;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="legend">
      <div class="pill"><span class="sw" style="background:var(--sold)"></span>Sold</div>
      <div class="pill"><span class="sw" style="background:var(--avail)"></span>Available</div>
    </div>

    <section class="card zoomCard">
      <div class="cardHead">Zoom</div>
      <div class="zoomBody">
        <div class="zoomWrap" id="zoomWrap">
          <div id="zoomSvgHost" class="zoomSvgHost"></div>
          <div class="zoomRing" id="zoomRing"></div>
        </div>
        <div class="hint">Select a stand to zoom in.</div>
      </div>
    </section>
  </section>

  <aside class="card side">
    <div class="section">
      <div style="font-weight:900;margin-bottom:10px;">Selected Stand</div>
      <div class="row">
        <div>
          <div style="color:var(--muted);font-weight:800;margin-bottom:6px;">Stand ID</div>
          <input id="selectedStandId" placeholder=""/>
        </div>
        <div>
          <div style="color:var(--muted);font-weight:800;margin-bottom:6px;">Company (sold only)</div>
          <input id="company" placeholder="Company name..."/>
        </div>
      </div>
      <div style="margin-top:10px;">
        <div style="color:var(--muted);font-weight:800;margin-bottom:6px;">Status</div>
        <select id="status">
          <option value="available">Available</option>
          <option value="sold">Sold</option>
        </select>
      </div>
      <div class="bigBtnRow">
        <button id="saveBtn" class="primary">Save</button>
        <button id="markAvailBtn" class="danger">Mark Available</button>
      </div>
      <button id="undoBtn" style="margin-top:10px;width:100%;" disabled>Undo (0)</button>
      <div class="hint">Click a stand on the plan or in the list to edit.</div>
    </div>

    <div class="section">
      <div style="font-weight:900;margin-bottom:10px;">Stands</div>
      <div style="display:flex;gap:10px;">
        <input id="search" placeholder="Search stand or company..." style="flex:1;"/>
        <select id="filter">
          <option value="all">All</option>
          <option value="sold">Sold</option>
          <option value="available">Available</option>
        </select>
      </div>
      <div class="hint"><span id="count">0</span> / <span id="total">0</span></div>
      <div class="listWrap">
        <table>
          <thead><tr><th style="width:90px;">Stand</th><th style="width:90px;">Status</th><th>Company</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </aside>
</main>

<div class="progressOverlay" id="progressOverlay" aria-hidden="true">
  <div class="progressCard">
    <div class="progressTitle" id="progressTitle">Updating…</div>
    <div class="progressMsg" id="progressMsg">Please keep this tab open.</div>
    <div class="progressBar"><div id="progressBarFill"></div></div>
  </div>
</div>

<input type="file" id="csvFile" accept=".csv,text/csv" style="display:none"/>

<script src="./shared.js?v=20260209" defer></script>
<script src="./admin.js?v=20260209" defer></script>
</body>
</html>
